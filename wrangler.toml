name = "review-pilot"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "review-pilot-db"
database_id = "76980f41-909e-4cc6-8196-49137ab958be"

# Cron Triggers (15分おきに新着レビューのバックアップ巡回)
[triggers]
crons = ["*/15 * * * *"]

# 環境変数 (シークレットは wrangler secret put で設定)
[vars]
ENVIRONMENT = "production"
APP_URL = "https://review-pilot.pages.dev"
