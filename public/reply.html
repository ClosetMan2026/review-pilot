<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クチコミ手動編集・返信 | らくらくクチコミ返信（らくコミくん）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2 font-black text-indigo-600">
        <span>✨</span> らくらくクチコミ返信 <span class="text-xs bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full font-bold ml-1">らくコミくん</span>
      </div>
      <span id="header-store-name" class="text-xs text-slate-500 font-medium">店舗管理画面</span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-2xl w-full mx-auto px-4 py-8 flex-1">
    
    <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-200">
      
      <div class="flex items-center justify-between mb-4 pb-4 border-b border-slate-100">
        <h1 class="text-lg font-black text-slate-900">✍️ クチコミへの返信を作成</h1>
        <span class="text-xs bg-indigo-50 text-indigo-700 font-bold px-2.5 py-1 rounded-full">手動編集・自由入力</span>
      </div>

      <!-- Target Review Box -->
      <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 mb-6">
        <div class="flex items-center justify-between mb-1">
          <div class="flex items-center gap-2">
            <span class="font-bold text-sm text-slate-900" id="reviewer-name">クチコミを読み込み中...</span>
            <span class="text-amber-500 text-xs font-bold" id="review-stars">★★★★★</span>
          </div>
          <span class="text-xs text-slate-400" id="review-time"></span>
        </div>
        <p class="text-sm text-slate-700 leading-relaxed italic" id="review-comment">
          読み込み中...
        </p>
        <div id="review-translation-box" class="hidden mt-2 bg-indigo-50/60 p-2.5 rounded-xl border border-indigo-100 text-xs text-slate-700">
          <span class="font-bold text-indigo-700">🔍 日本語訳:</span> <span id="review-translation-text"></span>
        </div>
      </div>

      <!-- AI Templates Insert Buttons -->
      <div class="mb-4">
        <label class="block text-xs font-bold text-slate-600 mb-2">💡 AIの生成案をベースに挿入する:</label>
        <div class="grid grid-cols-3 gap-2">
          <button type="button" onclick="insertTemplate('a')" class="text-xs font-semibold py-2 px-2 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 transition text-center truncate">
            A. 丁寧・王道
          </button>
          <button type="button" onclick="insertTemplate('b')" class="text-xs font-semibold py-2 px-2 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 transition text-center truncate">
            B. フレンドリー
          </button>
          <button type="button" onclick="insertTemplate('c')" class="text-xs font-semibold py-2 px-2 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 transition text-center truncate">
            C. お詫び・改善
          </button>
        </div>
      </div>

      <!-- Reply Text Area -->
      <div class="mb-6">
        <label class="block text-xs font-bold text-slate-700 mb-1">Googleマップに投稿する返信文</label>
        <textarea id="reply-text" rows="7" class="w-full bg-slate-50 border border-slate-300 rounded-2xl p-4 text-sm text-slate-800 leading-relaxed focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition" placeholder="返信文を入力または上のAI案から挿入してください..."></textarea>
        <div class="flex justify-between items-center mt-1 text-[11px] text-slate-400">
          <span>※店主様のお名前や店舗のこだわりを自由に追記できます。</span>
          <span id="char-count">0 文字</span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="space-y-3">
        <button type="button" onclick="submitReply()" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-6 rounded-2xl shadow-md hover:shadow-lg transition flex items-center justify-center gap-2">
          <span>🚀</span> この内容でGoogleマップに返信する
        </button>
        <a href="/dashboard.html" class="block text-center text-xs text-slate-400 hover:text-slate-600 font-medium py-1">
          キャンセルして管理画面に戻る
        </a>
      </div>

    </div>

  </main>

  <!-- Complete Modal -->
  <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl border border-slate-200">
      <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-4">
        ✓
      </div>
      <h3 class="text-lg font-black text-slate-900 mb-2">返信が完了しました！</h3>
      <p class="text-xs text-slate-600 mb-6 leading-relaxed">
        Googleマップのクチコミへ返信文が正常に登録・投稿されました。
      </p>
      <a href="/dashboard.html" class="block w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition text-sm">
        管理画面へ戻る
      </a>
    </div>
  </div>

  <!-- Footer -->
  <footer class="py-6 text-center text-xs text-slate-400 border-t border-slate-200 bg-white">
    <p>&copy; 2026 らくらくクチコミ返信（らくコミくん）. All rights reserved.</p>
  </footer>

  <script>
    let currentReview = null;
    let currentLocationId = null;

    const templates = {
      a: "この度はご来店いただき誠にありがとうございました。またのご来店をスタッフ一同心よりお待ちしております。",
      b: "ご来店ありがとうございました！楽しんでいただけてとても嬉しいです😊 次回もぜひお待ちしております！",
      c: "この度は当店へお越しいただき誠にありがとうございました。至らない点がございましたことを深くお詫び申し上げます。今後の改善に努めてまいります。"
    };

    const textarea = document.getElementById('reply-text');
    const countDisplay = document.getElementById('char-count');

    function insertTemplate(type) {
      textarea.value = templates[type] || "";
      updateCount();
    }

    textarea.addEventListener('input', updateCount);

    function updateCount() {
      countDisplay.innerText = `${textarea.value.length} 文字`;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
      } catch (e) {
        return dateStr;
      }
    }

    async function initPage() {
      const urlParams = new URLSearchParams(window.location.search);
      const status = urlParams.get('status');
      if (status === 'success') {
        const modal = document.getElementById('modal');
        if (modal) modal.classList.remove('hidden');
      }

      const reviewId = urlParams.get('review_id');
      currentLocationId = urlParams.get('location_id');

      // 1. 認証と店舗名取得
      try {
        const authRes = await fetch('/api/auth/me');
        if (authRes.ok) {
          const authData = await authRes.json();
          if (authData.locations && authData.locations.length > 0) {
            const loc = authData.locations[0];
            const headerStore = document.getElementById('header-store-name');
            if (headerStore) headerStore.innerText = loc.location_name;
            if (!currentLocationId) currentLocationId = loc.id;
          }
        }
      } catch (e) {
        console.warn('Auth fetch error:', e);
      }

      // 2. クチコミデータ取得
      try {
        const apiUrl = currentLocationId ? `/api/reviews?location_id=${encodeURIComponent(currentLocationId)}` : '/api/reviews';
        const res = await fetch(apiUrl);
        if (res.ok) {
          const data = await res.json();
          if (data.reviews && data.reviews.length > 0) {
            let matched = null;
            if (reviewId) {
              matched = data.reviews.find(r => r.id === reviewId);
            }
            if (!matched) {
              matched = data.reviews.find(r => !r.reply_status || !r.reply_status.startsWith('replied')) || data.reviews[0];
            }

            if (matched) {
              currentReview = matched;
              if (!currentLocationId) currentLocationId = matched.location_id;

              const rawReviewer = (matched.reviewer_name || 'お客様').trim();
              const formattedReviewer = rawReviewer.endsWith('様') ? rawReviewer : `${rawReviewer} 様`;
              document.getElementById('reviewer-name').innerText = `${formattedReviewer}のクチコミ`;

              document.getElementById('review-stars').innerText = '★'.repeat(matched.star_rating || 5) + '☆'.repeat(Math.max(0, 5 - (matched.star_rating || 5)));
              document.getElementById('review-time').innerText = formatDate(matched.review_created_at || matched.created_at);
              document.getElementById('review-comment').innerText = `「${matched.comment || ''}」`;

              // 外国語翻訳表示
              const transBox = document.getElementById('review-translation-box');
              const transText = document.getElementById('review-translation-text');
              if (transBox && transText) {
                if (matched.translated_comment) {
                  transText.innerText = matched.translated_comment;
                  transBox.classList.remove('hidden');
                } else {
                  transBox.classList.add('hidden');
                }
              }

              if (matched.generated_reply_a) templates.a = matched.generated_reply_a;
              if (matched.generated_reply_b) templates.b = matched.generated_reply_b;
              if (matched.generated_reply_c) templates.c = matched.generated_reply_c;

              // 初期テンプレート選択: 1~2星ならお詫び案C、それ以外は丁寧案A
              if (matched.star_rating <= 2) {
                insertTemplate('c');
              } else {
                insertTemplate('a');
              }
              return;
            }
          }
        }
      } catch (e) {
        console.warn('Review fetch error:', e);
      }

      // フォールバック初期表示
      document.getElementById('reviewer-name').innerText = '鈴木 一郎 様のクチコミ';
      document.getElementById('review-stars').innerText = '★★☆☆☆';
      document.getElementById('review-time').innerText = '新着';
      document.getElementById('review-comment').innerText = '「料理はおいしかったのですが、隣の席との間隔が狭くて少し落ち着かなかったです。」';
      templates.a = "この度は当店をご利用いただき誠にありがとうございます。お料理をお気に召していただけた一方で、お席の配置につきましてご窮屈な思いをおかけしてしまい申し訳ございませんでした。今後のレイアウト改善に努めます。";
      templates.b = "ご来店いただきありがとうございました！味を褒めていただき嬉しいです😊 お席の間隔について落ち着かなかったとのこと、大変申し訳ありませんでした。より居心地の良いお店作りに努めます！";
      templates.c = "この度は当店をご利用いただいたにもかかわらず、ご不快な思いをさせてしまい誠に申し訳ございませんでした。いただいたご指摘を真摯に受け止め、座席配置の見直し等、改善に努めてまいります。";
      insertTemplate('c');
    }

    async function submitReply() {
      const text = textarea.value.trim();
      if (!text) {
        alert('返信文を入力してください。');
        return;
      }
      const btn = document.getElementById('submit-btn');
      const origText = btn.innerHTML;
      btn.innerHTML = '<span>⏳</span> Googleマップへ送信中...';
      btn.disabled = true;

      const reviewId = currentReview ? currentReview.id : new URLSearchParams(window.location.search).get('review_id') || 'reviews/104';
      const locId = currentLocationId || (currentReview ? currentReview.location_id : 'locations/184920481920');

      try {
        const res = await fetch('/api/reviews/reply', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            reviewId: reviewId,
            locationId: locId,
            replyText: text,
            replyStatus: 'replied_manual'
          })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          document.getElementById('modal').classList.remove('hidden');
        } else {
          alert('返信の送信に失敗しました: ' + (data.error || '不明なエラー'));
          btn.disabled = false;
          btn.innerHTML = origText;
        }
      } catch (err) {
        alert('通信エラーが発生しました: ' + err.message);
        btn.disabled = false;
        btn.innerHTML = origText;
      }
    }

    document.addEventListener('DOMContentLoaded', initPage);
  </script>

</body>
</html>
